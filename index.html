<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jelay</title>
    <style>
        body {
            background-color: #050505;
            color: #ff4d6d;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            transition: background-color 3s;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: none;
            color: #ff4d6d;
            border: 2px solid #ff4d6d;
            cursor: pointer;
            border-radius: 50px;
            z-index: 1000;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 77, 109, 0.3);
        }

        .layout {
            display: flex;
            flex-direction: row; /* Default for Desktop/Landscape */
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding: 20px;
        }

        /* Mobile Fix: Stacks vertically if the phone is held upright */
        @media (max-width: 768px) and (orientation: portrait) {
            .layout { flex-direction: column; }
            #heart-container { font-size: 6px !important; line-height: 6px !important; }
            .messages { width: 90% !important; text-align: center; }
        }

        #heart-container {
            white-space: pre;
            line-height: 8px;
            font-size: 8px;
            text-shadow: 0 0 8px #ff4d6d;
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 280px;
        }

        .side-text {
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #fce4ec;
            opacity: 0;
            transition: all 1s ease;
            font-style: italic;
        }

        .show { opacity: 1; transform: translateY(0); }
        .hide { opacity: 0; transform: translateY(-10px); display: none; }

        .beating { animation: heartbeat 1.5s infinite ease-in-out; }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startApp()">START OUR STORY ❤️</button>

    <div class="layout">
        <div class="messages" id="left-side">
            <div class="side-text" id="m1">"I know i have done alot that is bad and i am truly sorry"</div>
            <div class="side-text" id="m2">"Now i am willing to learn every language of code just to say sorry in every language of code"</div>
        </div>

        <div id="heart-container"></div>

        <div class="messages" id="right-side">
            <div class="side-text" id="m3">"You are my love of my life i wont let it waste it again my jelay"</div>
            <div class="side-text" id="m4">"Please let me prove my self again this time po ah :<"</div>
        </div>
    </div>

    <audio id="myAudio">
        <source src="music.mp3" type="audio/mpeg">
        <source src="music.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('myAudio');
        const heart = document.getElementById('heart-container');
        const btn = document.getElementById('start-btn');
        const text = "I LOVE YOU ";
        let heartString = "";

        // Generate Heart
        let charIndex = 0;
        for (let y = 15; y > -15; y--) {
            for (let x = -30; x < 30; x++) {
                const f = Math.pow((x * 0.05)**2 + (y * 0.1)**2 - 1, 3) - (x * 0.05)**2 * (y * 0.1)**3;
                if (f <= 0) {
                    heartString += text[charIndex % text.length];
                    charIndex++;
                } else {
                    heartString += " ";
                }
            }
            heartString += "\n";
        }

        function startApp() {
            btn.style.display = 'none';
            audio.play();
            let i = 0;
            function type() {
                if (i < heartString.length) {
                    heart.innerHTML += heartString.charAt(i);
                    i++;
                    setTimeout(type, 1);
                } else { heart.classList.add('beating'); }
            }
            type();
        }

        audio.ontimeupdate = function() {
            // 19-Second Mark
            if (audio.currentTime >= 19 && audio.currentTime < 30) {
                document.getElementById('m1').classList.add('show');
                document.getElementById('m2').classList.add('show');
                document.getElementById('m3').classList.add('show');
                document.getElementById('m4').classList.add('show');
            }
            
            // 30-Second Mark: Change the text
            if (audio.currentTime >= 30) {
                document.getElementById('m1').innerText = "I am willing to wait and suffer just to show that i am sorry";
                document.getElementById('m2').innerText = "Sorry for everything my jelay";
                document.getElementById('m3').innerText = "I promise i will be more gentle to you this time po";
                document.getElementById('m4').innerText = "i love you sm my jelay!!";
                
                // Add a little extra glow to the heart at 30s
                heart.style.textShadow = "0 0 20px #ff4d6d, 0 0 40px #ff4d6d";
                document.body.style.backgroundColor = "#1a0508"; 
            }
        };
    </script>
</body>
</html>
