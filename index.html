<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Jelay</title>
    <style>
        body { background-color: #050505; color: #ff4d6d; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        #start-btn { padding: 15px 40px; font-size: 18px; border: 2px solid #ff4d6d; background: none; color: #ff4d6d; cursor: pointer; border-radius: 50px; z-index: 1000; margin-top: 250px; }
        
        .layout { display: flex; align-items: center; gap: 40px; margin-top: 50px; transition: all 2s; }
        #heart-container { white-space: pre; line-height: 8px; font-size: 8px; text-shadow: 0 0 8px #ff4d6d; }
        
        .side-text { font-family: 'Segoe UI', sans-serif; font-size: 16px; color: #fce4ec; opacity: 0; transition: opacity 1s; width: 250px; text-align: center; }
        .show { opacity: 1; }

        /* The Long Message Box - Sits under the heart */
        #long-message-box { width: 80%; max-width: 600px; margin-top: 30px; text-align: center; color: #ff85a1; font-size: 18px; opacity: 0; transition: opacity 3s; }
        
        .beating { animation: heartbeat 1.5s infinite ease-in-out; }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    </style>
</head>
<body>

    <button id="start-btn" onclick="startApp()">START OUR STORY ❤️</button>

    <div class="layout" id="main-layout">
        <div class="side-text" id="m1"></div>
        <div id="heart-container"></div>
        <div class="side-text" id="m2"></div>
    </div>

    <div id="long-message-box"></div>

    <audio id="myAudio"><source src="music.mp3" type="audio/mpeg"></audio>

    <script>
        const heart = document.getElementById('heart-container');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');
        const longMessageBox = document.getElementById('long-message-box');

        const messages = [
            ["I know i have done alot that is bad and i am truly sorry", "Now i am willing to learn every language of code"],
            ["You are my love of my life", "I wont let it waste it again my jelay"],
            ["I am willing to wait and suffer just to show that i am sorry", "Sorry for everything my jelay"],
            ["I promise i will be more gentle to you this time po", "i love you sm my jelay!!"]
        ];

        function getHeart(text) {
            let str = ""; let charIndex = 0;
            for (let y = 15; y > -15; y--) {
                for (let x = -30; x < 30; x++) {
                    const f = Math.pow((x * 0.05)**2 + (y * 0.1)**2 - 1, 3) - (x * 0.05)**2 * (y * 0.1)**3;
                    if (f <= 0) { str += text[charIndex % text.length]; charIndex++; } else { str += " "; }
                }
                str += "\n";
            }
            return str;
        }

        async function startApp() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('myAudio').play();
            
            let fullHeart = getHeart("I LOVE YOU MY JELAY ");
            for(let char of fullHeart) { heart.innerText += char; await new Promise(r => setTimeout(r, 0.5)); }
            heart.classList.add('beating');

            for(let batch of messages) {
                m1.innerText = batch[0]; m2.innerText = batch[1];
                m1.classList.add('show'); m2.classList.add('show');
                await new Promise(r => setTimeout(r, 4000));
                m1.classList.remove('show'); m2.classList.remove('show');
                await new Promise(r => setTimeout(r, 500));
            }

            // Rebuild
            heart.innerText = "";
            for(let char of fullHeart) { heart.innerText += char; await new Promise(r => setTimeout(r, 0.5)); }
            
            // Show Long Message under the heart
            longMessageBox.style.opacity = 1;
            longMessageBox.innerText = "I misss you smm my jelay just let me prove myself once again, my love for you is geniune as the day we met and the day we became official, always i miss when i joke na mabubungo ako when you dont say any ingat to me when ihahatid kita everytime sa sakayan po, i miss max, i miss bruno too, and my mama misses you everytime nadinadala kita dito, you always make me smile and i truly know eversince we became official i know you are the one my love my jelay :<";
        }
    </script>
</body>
</html>
